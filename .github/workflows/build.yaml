name: Build
on: [ push, pull_request ]

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
  
    - name: Docker-Buildumgebung erstellen
      run: docker build --file Dockerfile --tag petclinic-ci .

    - name: Maven-Build mit Tests
      shell: bash
      run: |
        set -o pipefail
        docker run --rm \
          --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
          petclinic-ci 2>&1 | tee maven.log
    
    - name: Maven-Log und Testberichte speichern
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: maven-diagnostics
        path: |
          maven.log
          **/target/surefire-reports/**
        if-no-files-found: warn