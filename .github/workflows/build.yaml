name: Maven CI Benchmark

on:
  push:
    branches:
      - main
      - 'fault/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Build und Tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B clean verify 2>&1 | tee maven.log

      - name: Maven-Logs und Surefire-Berichte speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-diagnostics
          path: |
            maven.log
            **/target/surefire-reports/**
          if-no-files-found: warn
